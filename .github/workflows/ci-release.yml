name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -tags ci ./...
      - run: go vet -tags ci ./...
      - name: Build native Linux desktop app
        run: go build -trimpath -o /tmp/poker-clock-ci ./cmd/poker-clock

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: windows
            goarch: amd64
            runner: windows-2022
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev
      - name: Install Windows amd64 CGO toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Windows arm64 MinGW toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        run: |
          $toolchainVersion = '20261104'
          $toolchainName = "llvm-mingw-$toolchainVersion-ucrt-aarch64"
          $archive = Join-Path $env:RUNNER_TEMP "$toolchainName.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$toolchainVersion/$toolchainName.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '7d7f8387a8706639b0b47a629d6e23f8b3ef9acce67e9832b8cd4c5bb2816eab') { throw 'LLVM MinGW archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $toolchainBin = Join-Path $env:RUNNER_TEMP "$toolchainName\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $toolchainBin
          & (Join-Path $toolchainBin 'aarch64-w64-mingw32-clang.exe') --version
        shell: pwsh
      - name: Build Linux/macOS binary
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-X=git.mpx.sk/elvis/poker_clock/internal/ui.BuildVersion=${VERSION}" -o "dist/poker-clock-${GOOS}-${GOARCH}" ./cmd/poker-clock
      - name: Build Windows binary
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CC: ${{ matrix.goarch == 'amd64' && 'gcc' || 'aarch64-w64-mingw32-clang' }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $output = "dist/poker-clock-$($env:GOOS)-$($env:GOARCH).exe"
          go build -trimpath -ldflags="-H=windowsgui -X=git.mpx.sk/elvis/poker_clock/internal/ui.BuildVersion=$env:VERSION" -o $output ./cmd/poker-clock
      - uses: actions/upload-artifact@v4
        with:
          name: poker-clock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/poker-clock-*
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: poker-clock-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
